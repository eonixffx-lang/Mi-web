    <title>Intranet</title>

            padding: 0;
            box-sizing: border-box;

        }

            color: #00aaff;

            line-height: 1.5;
        }

            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

            color: #777777;
        }

        }
