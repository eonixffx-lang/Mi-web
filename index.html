<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intranet</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.container{
    background:#111;
    padding:40px;
    border-radius:15px;
    width:350px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,170,255,.3);
}

h1{
    color:#00aaff;
    margin-bottom:15px;
}

p{
    color:#ccc;
    margin-bottom:20px;
    line-height:1.5;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    font-size:16px;
}

input::placeholder{
    color:#888;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#00aaff;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}
