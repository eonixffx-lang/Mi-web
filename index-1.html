<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>SpectraX Demo</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#111;border:1px solid #700;padding:30px;border-radius:16px;box-shadow:0 0 20px #700;text-align:center;width:360px}
h1{color:#f33}input{width:100%;padding:12px;margin:8px 0;background:#222;color:#fff;border:1px solid #600;border-radius:8px}
button{width:100%;padding:12px;background:#b00;color:#fff;border:none;border-radius:8px;cursor:pointer}
small,a{color:#f66}
#page2{display:none}
textarea{width:100%;height:120px;background:#111;color:#fff;border:1px solid #700}
img{max-width:120px;margin-bottom:10px}
</style></head><body>
<div id='page1' class='card'>
<img src='logo.png' alt='Logo'>
<h1>SpectraX</h1>
<p>Bienvenido/a a SpectraX. Por favor ingrese su usuario y contraseña para continuar.</p>
<input placeholder='Ingrese su usuario'>
<input type='password' placeholder='Ingrese su contraseña'>
<button onclick="page1.style.display='none';page2.style.display='block'">Entrar</button>
<p><small>Si no cuenta con un usuario puede comprar uno aquí:<br>+51 932 759 280</small></p>
</div>
<div id='page2' class='card'>
<h1>Bienvenido Eonix</h1>
<p>¿Qué quiere saber?</p>
<textarea placeholder='Escriba aquí...'></textarea>
</div>
</body></html>
